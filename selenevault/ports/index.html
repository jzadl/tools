<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ports :: svault :: selene</title>
<link rel="stylesheet" href="../shared.css">
<style>
  :root{ --sec-accent: #7db8ff; }
  .secbar{padding:32px 28px 24px 28px; border-bottom:1px solid var(--line);}
  .secbar h1{font-size:24px; font-weight:600; letter-spacing:-0.02em;}
  .secbar .sub{color:var(--fg-dim); font-size:13px; margin-top:8px; max-width:600px;}

  .controlrow{padding:16px 28px; display:flex; gap:10px; border-bottom:1px solid var(--line);}

  main{padding:24px 28px 0 28px;}
  .list{display:flex; flex-direction:column; gap:12px;}

  .entrycard{
    background:var(--bg-card);
    border:1px solid var(--line);
    border-left:3px solid var(--sec-accent);
    border-radius:8px;
    padding:20px 22px;
  }
  .entry-top{display:flex; align-items:center; gap:10px; flex-wrap:wrap; justify-content:space-between;}
  .entry-name{font-size:16px; font-weight:600; letter-spacing:-0.01em; display:flex; align-items:center; gap:10px;}
  .entry-desc{color:var(--fg-dim); font-size:12.5px; margin-top:8px; max-width:640px;}
  .entry-meta{
    display:flex; gap:16px; font-family:var(--mono); font-size:11px; color:var(--fg-faint);
    margin-top:12px; flex-wrap:wrap;
  }
  .entry-meta span b{color:var(--fg-dim); font-weight:400;}
  .entry-foot{display:flex; align-items:center; justify-content:space-between; margin-top:16px; padding-top:14px; border-top:1px solid var(--line);}
  .entry-by{font-size:11.5px; color:var(--fg-faint);}
  .entry-dl{
    font-family:var(--mono); font-size:12px; color:var(--sec-accent);
    border:1px solid var(--line-strong); padding:7px 16px; border-radius:6px;
  }
  .entry-dl:hover{background:var(--bg-raised); border-color:var(--sec-accent);}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand"><div class="dot"></div><b>svault</b><span>selene archive</span></div>
  <a class="backlink" href="../">← all sections</a>
</div>

<div class="secbar">
  <h1>Ports</h1>
  <div class="sub" id="about">loading...</div>
</div>

<div class="controlrow">
  <input class="searchbox" id="search" type="text" placeholder="filter by name, maintainer, or version...">
</div>

<main>
  <div class="list" id="list"><div class="state">reading manifest...</div></div>
</main>

<footer>
  <div>svault :: Ports</div>
  <div><a href="../">back to index</a> :: <a href="#">contact@jzadl.xyz</a></div>
</footer>

<script>
/* Reads ports.sman from the CDN. Add a new entry by copy/pasting a
   name/version/... block into that .sman file, no code changes here. */
const URL_ = "https://cdn.jsdelivr.net/gh/jzadl/cdn/svault/ports.sman";

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function parseSman(text){
  const lines = text.split("\n");
  let about = "";
  const entries = [];
  let entry = null;
  function push(){ if(entry && entry.name) entries.push(entry); entry = null; }
  for(let raw of lines){
    const line = raw.trim();
    if(!line){ push(); continue; }
    const kv = line.match(/^([a-zA-Z_]+):\s*(.*)$/);
    if(!kv) continue;
    const key = kv[1].toLowerCase(), val = kv[2].trim();
    if(key === "about" && !entry){ about = val; continue; }
    if(key === "name"){ push(); entry = { name: val }; continue; }
    if(entry) entry[key] = val;
  }
  push();
  return { about, entries };
}

function render(entries){
  const list = document.getElementById("list");
  if(!entries.length){ list.innerHTML = '<div class="state">no entries yet</div>'; return; }
  list.innerHTML = entries.map(e => {
    const tagClass = (e.status||"").toLowerCase();
    return `
      <div class="entrycard" data-search="${esc((e.name+" "+(e.maintainer||"")+" "+(e.version||"")).toLowerCase())}">
        <div class="entry-top">
          <div class="entry-name">${esc(e.name)} ${e.status ? `<span class="tag ${esc(tagClass)}">${esc(e.status)}</span>` : ""}</div>
        </div>
        ${e.note ? `<div class="entry-desc">${esc(e.note)}</div>` : ""}
        <div class="entry-meta">
          ${e.version ? `<span><b>version</b> ${esc(e.version)}</span>` : ""}
          ${e.size ? `<span><b>size</b> ${esc(e.size)}</span>` : ""}
          ${e.date ? `<span><b>updated</b> ${esc(e.date)}</span>` : ""}
        </div>
        <div class="entry-foot">
          <span class="entry-by">${e.maintainer ? "maintained by " + esc(e.maintainer) : ""}</span>
          <a class="entry-dl" href="${esc(e.url||"#")}" target="_blank" rel="noopener">↓ download</a>
        </div>
      </div>`;
  }).join("");
}

let ENTRIES = [];

async function init(){
  try{
    const res = await fetch(URL_);
    if(!res.ok) throw new Error();
    const { about, entries } = parseSman(await res.text());
    document.getElementById("about").textContent = about || "";
    ENTRIES = entries;
    render(ENTRIES);
  }catch(e){
    document.getElementById("about").textContent = "";
    document.getElementById("list").innerHTML = '<div class="state">couldn\'t load ports.sman</div>';
  }
}

document.getElementById("search").addEventListener("input", (e) => {
  const f = e.target.value.toLowerCase().trim();
  render(f ? ENTRIES.filter(en => (en.name+" "+(en.maintainer||"")+" "+(en.version||"")).toLowerCase().includes(f)) : ENTRIES);
});

init();
</script>

</body>
</html>
